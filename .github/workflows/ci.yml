name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Example checks pass
        run: npm run example
      - name: A failing check is reported as failing
        run: "! node src/runner.mjs --once --config test/fixtures/checks.yml"

  hurl:
    # The upstream .deb depends on libxml2, which 26.04 replaced with libxml2-16.
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=Orange-OpenSource/hurl
      HURL_VERSION: "8.1.0"
      # A version bump fails here until the checksum of the new .deb is set.
      HURL_SHA256: "c56222c8923d3940533ac3d7085f66cb6fa6c05639f33aaeef8d857ab70622f9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: Install hurl
        run: |
          curl -fsSLo hurl.deb "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          echo "${HURL_SHA256}  hurl.deb" | sha256sum -c -
          sudo apt-get install -y ./hurl.deb
      - name: Example flow passes
        run: |
          hurl/hurl-probe hurl/example.hurl | tee metrics.txt
          grep -qF 'synthetic_hurl_step_success{index="02",step="GET /posts"} 1' metrics.txt

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: playwright-synthetic-exporter:test
      - name: Image runs the example checks
        run: docker run --rm --init --shm-size 512m playwright-synthetic-exporter:test --once
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/playwright-synthetic-exporter
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
